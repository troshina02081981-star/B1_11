<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Собери памятку</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #ffffff;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .container {
            max-width: 820px;
            width: 100%;
            height: 100%;
            max-height: 98vh;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px 24px 18px;
            display: flex;
            flex-direction: column;
            border: 1px solid #eef2f7;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.04);
        }

        .header {
            flex-shrink: 0;
            margin-bottom: 10px;
        }

        .header h2 {
            font-size: 1.2rem;
            font-weight: 650;
            color: #0b1f3b;
        }

        .header p {
            font-size: 0.82rem;
            color: #5a7a9a;
            margin-top: 2px;
        }

        .game-area {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Список фраз для перетаскивания */
        .cards-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px 12px;
            background: #f7f9fc;
            border-radius: 14px;
            border: 2px dashed #d0d8e5;
            flex-shrink: 0;
            min-height: 60px;
        }

        .card {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            color: #0b1f3b;
            background: #eef4fb;
            border: 1.5px solid #c7d9ed;
            cursor: grab;
            user-select: none;
            transition: 0.1s;
            white-space: nowrap;
        }

        .card:hover {
            background: #dce8f5;
            transform: scale(1.02);
        }

        .card:active {
            cursor: grabbing;
        }

        .card.placed {
            opacity: 0.3;
            pointer-events: none;
        }

        /* Две колонки */
        .columns {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            gap: 12px;
        }

        .column {
            flex: 1;
            background: #fafcff;
            border-radius: 14px;
            border: 2px solid #e1ebf6;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            transition: border-color 0.2s, background 0.2s;
        }

        .column.drag-over {
            border-color: #1a5f8b;
            background: #edf4fe;
        }

        .column-header {
            font-size: 0.8rem;
            font-weight: 600;
            color: #0b1f3b;
            flex-shrink: 0;
            padding-bottom: 6px;
            border-bottom: 2px solid #e1ebf6;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .column-header .badge-col {
            font-size: 0.6rem;
            background: #dce6f5;
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
            color: #1f4870;
            font-weight: 600;
        }

        .column-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 6px 2px 2px 2px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .column-body::-webkit-scrollbar {
            width: 3px;
        }
        .column-body::-webkit-scrollbar-thumb {
            background: #c5d0e0;
            border-radius: 8px;
        }

        .column-card {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.78rem;
            color: #0b1f3b;
            background: #eef4fb;
            border: 1.5px solid #c7d9ed;
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
            flex-shrink: 0;
        }

        .column-card:hover {
            background: #dce8f5;
        }

        .column-card.correct {
            border-color: #1e8e3e;
            background: #d7eade;
        }

        .column-card.wrong {
            border-color: #c72a2a;
            background: #fde0e0;
        }

        .column-card.missed {
            border-color: #d4a017;
            background: #fef8e7;
            border-style: dashed;
        }

        .column-empty {
            font-size: 0.75rem;
            color: #8a9aa8;
            text-align: center;
            padding: 12px 0;
            font-style: italic;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            flex-shrink: 0;
            margin-top: 6px;
        }

        .btn {
            background: white;
            border: 1px solid #c7d9ed;
            padding: 0.25rem 1.2rem;
            border-radius: 30px;
            font-weight: 600;
            color: #1b4470;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.8rem;
            height: 34px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }

        .btn-primary {
            background: #1a5f8b;
            border: 1px solid #1a5f8b;
            color: white;
            box-shadow: 0 3px 8px rgba(21, 80, 120, 0.15);
        }
        .btn-primary:hover {
            background: #0e4a70;
        }
        .btn-outline:hover {
            background: #e9f0fa;
        }
        .btn-success {
            background: #1e8e3e;
            border: 1px solid #1e8e3e;
            color: white;
        }
        .btn-success:hover {
            background: #157a33;
        }

        .banner {
            flex-shrink: 0;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.82rem;
            display: none;
            border: 1px solid;
            line-height: 1.5;
            margin-top: 6px;
        }
        .banner.show {
            display: block;
        }
        .banner.success {
            background: #e1f5e8;
            border-color: #1f8b4c;
            color: #0a4628;
        }
        .banner.fail {
            background: #fde9e9;
            border-color: #b33c3c;
            color: #712b2b;
        }

        .hint {
            flex-shrink: 0;
            font-size: 0.7rem;
            color: #8a9aa8;
            text-align: center;
            padding-top: 4px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 12px 14px 12px;
                max-height: 100vh;
                border-radius: 16px;
            }
            .header h2 {
                font-size: 1rem;
            }
            .columns {
                flex-direction: column;
            }
            .column {
                min-height: 100px;
            }
            .card {
                font-size: 0.7rem;
                padding: 4px 10px;
            }
            .btn {
                font-size: 0.7rem;
                height: 30px;
                padding: 0.2rem 0.8rem;
            }
            .column-card {
                font-size: 0.7rem;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>📋 Собери памятку по безопасному ремонту</h2>
            <p>Перетащите карточки в нужную колонку</p>
        </div>

        <div class="game-area">
            <!-- Пул карточек -->
            <div class="cards-pool" id="cardsPool"></div>

            <!-- Колонки -->
            <div class="columns">
                <div class="column" id="colCan">
                    <div class="column-header">
                        ✅ Можно
                        <span class="badge-col" id="countCan">0</span>
                    </div>
                    <div class="column-body" id="colCanBody">
                        <div class="column-empty">Перетащите сюда разрешённые действия</div>
                    </div>
                </div>

                <div class="column" id="colCannot">
                    <div class="column-header">
                        ❌ Нельзя
                        <span class="badge-col" id="countCannot">0</span>
                    </div>
                    <div class="column-body" id="colCannotBody">
                        <div class="column-empty">Перетащите сюда запрещённые действия</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="checkBtn">✅ Проверить</button>
            <button class="btn btn-outline" id="resetBtn">🔄 Сбросить</button>
        </div>

        <div class="banner" id="banner"></div>
        <div class="hint">Нажмите на карточку в колонке, чтобы вернуть её обратно</div>
    </div>

    <script>
        (function() {
            // ---- данные ----
            const items = [{
                id: 1,
                text: 'Оформить наряд-допуск',
                isAllowed: true
            }, {
                id: 2,
                text: 'Провести инструктаж',
                isAllowed: true
            }, {
                id: 3,
                text: 'Проверить СИЗ у бригады',
                isAllowed: true
            }, {
                id: 4,
                text: 'Работать без наряда-допуска',
                isAllowed: false
            }, {
                id: 5,
                text: 'Использовать конструкции как опоры без проверки',
                isAllowed: false
            }, {
                id: 6,
                text: 'Загромождать проезд к пожарному гидранту',
                isAllowed: false
            }, {
                id: 7,
                text: 'Постоянно следить за воздушной средой',
                isAllowed: true
            }, {
                id: 8,
                text: 'Пускать эксплуатационный персонал в ремонтную зону',
                isAllowed: false
            }, {
                id: 9,
                text: 'Проводить огневые работы ночью в неотложных случаях',
                isAllowed: true
            }, {
                id: 10,
                text: 'Начинать ремонт без проекта производства работ',
                isAllowed: false
            }];

            // ---- DOM ----
            const pool = document.getElementById('cardsPool');
            const colCanBody = document.getElementById('colCanBody');
            const colCannotBody = document.getElementById('colCannotBody');
            const countCan = document.getElementById('countCan');
            const countCannot = document.getElementById('countCannot');
            const checkBtn = document.getElementById('checkBtn');
            const resetBtn = document.getElementById('resetBtn');
            const banner = document.getElementById('banner');

            let placed = {}; // { id: 'can' | 'cannot' }
            let draggedId = null;
            let dragSource = null; // 'pool' | 'can' | 'cannot'

            // ---- рендер ----
            function render() {
                // Пул
                const poolItems = items.filter(item => !placed[item.id]);
                if (poolItems.length === 0) {
                    pool.innerHTML =
                        '<span style="font-size:0.8rem;color:#8a9aa8;width:100%;text-align:center;padding:4px 0;">Все карточки разложены</span>';
                } else {
                    pool.innerHTML = poolItems.map(item =>
                        `<div class="card" draggable="true" data-id="${item.id}">${item.text}</div>`
                    ).join('');
                }

                // Колонки
                const canItems = items.filter(item => placed[item.id] === 'can');
                const cannotItems = items.filter(item => placed[item.id] === 'cannot');

                colCanBody.innerHTML = canItems.length === 0 ?
                    '<div class="column-empty">Перетащите сюда разрешённые действия</div>' :
                    canItems.map(item =>
                        `<div class="column-card" data-id="${item.id}" data-col="can">${item.text}</div>`
                    ).join('');

                colCannotBody.innerHTML = cannotItems.length === 0 ?
                    '<div class="column-empty">Перетащите сюда запрещённые действия</div>' :
                    cannotItems.map(item =>
                        `<div class="column-card" data-id="${item.id}" data-col="cannot">${item.text}</div>`
                    ).join('');

                countCan.textContent = canItems.length;
                countCannot.textContent = cannotItems.length;

                // убираем подсветку
                document.querySelectorAll('.column-card').forEach(el => {
                    el.classList.remove('correct', 'wrong', 'missed');
                });

                // обновляем draggable для карточек в колонках
                document.querySelectorAll('.column-card').forEach(el => {
                    el.draggable = true;
                });

                // обновляем события
                attachEvents();
            }

            // ---- события перетаскивания ----
            function attachEvents() {
                // все draggable элементы
                document.querySelectorAll('[draggable="true"]').forEach(el => {
                    el.removeEventListener('dragstart', handleDragStart);
                    el.removeEventListener('dragend', handleDragEnd);
                    el.addEventListener('dragstart', handleDragStart);
                    el.addEventListener('dragend', handleDragEnd);
                });

                // колонки
                document.querySelectorAll('.column').forEach(col => {
                    col.removeEventListener('dragover', handleDragOver);
                    col.removeEventListener('dragenter', handleDragEnter);
                    col.removeEventListener('dragleave', handleDragLeave);
                    col.removeEventListener('drop', handleDrop);
                    col.addEventListener('dragover', handleDragOver);
                    col.addEventListener('dragenter', handleDragEnter);
                    col.addEventListener('dragleave', handleDragLeave);
                    col.addEventListener('drop', handleDrop);
                });

                // клик по карточке в колонке — возврат в пул
                document.querySelectorAll('.column-card').forEach(el => {
                    el.removeEventListener('click', handleCardClick);
                    el.addEventListener('click', handleCardClick);
                });
            }

            function handleDragStart(e) {
                const id = parseInt(this.dataset.id);
                draggedId = id;
                if (this.closest('.cards-pool')) {
                    dragSource = 'pool';
                } else if (this.closest('#colCanBody')) {
                    dragSource = 'can';
                } else if (this.closest('#colCannotBody')) {
                    dragSource = 'cannot';
                }
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', id);
                setTimeout(() => { this.style.opacity = '0.4'; }, 0);
            }

            function handleDragEnd(e) {
                this.style.opacity = '1';
                document.querySelectorAll('.column').forEach(col => col.classList.remove('drag-over'));
            }

            function handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            }

            function handleDragEnter(e) {
                e.preventDefault();
                this.classList.add('drag-over');
            }

            function handleDragLeave(e) {
                this.classList.remove('drag-over');
            }

            function handleDrop(e) {
                e.preventDefault();
                this.classList.remove('drag-over');
                const id = parseInt(e.dataTransfer.getData('text/plain'));
                if (!id) return;

                const targetCol = this.closest('.column');
                if (!targetCol) return;

                const colType = targetCol.id === 'colCan' ? 'can' : 'cannot';

                // если карточка уже в этой колонке — ничего не делаем
                if (placed[id] === colType) return;

                // если карточка в пуле — просто кладём
                // если в другой колонке — перемещаем
                placed[id] = colType;
                render();
            }

            function handleCardClick(e) {
                const id = parseInt(this.dataset.id);
                if (placed[id]) {
                    delete placed[id];
                    render();
                }
            }

            // ---- проверка ----
            function checkAnswers() {
                // проверяем, все ли карточки разложены
                const total = items.length;
                const placedCount = Object.keys(placed).length;
                if (placedCount < total) {
                    banner.className = 'banner fail show';
                    banner.innerHTML = '⚠️ Разложите все карточки перед проверкой.';
                    return;
                }

                let correct = 0;
                let wrong = 0;

                // подсветка
                document.querySelectorAll('.column-card').forEach(el => {
                    const id = parseInt(el.dataset.id);
                    const item = items.find(i => i.id === id);
                    const col = el.dataset.col;
                    const isCorrect = (col === 'can' && item.isAllowed) || (col === 'cannot' && !item.isAllowed);
                    el.classList.remove('correct', 'wrong');
                    if (isCorrect) {
                        el.classList.add('correct');
                        correct++;
                    } else {
                        el.classList.add('wrong');
                        wrong++;
                    }
                });

                const allCorrect = wrong === 0;
                banner.className = 'banner show';
                if (allCorrect) {
                    banner.className = 'banner success show';
                    banner.innerHTML = '✅ Отлично! Вы правильно распределили все действия.';
                } else {
                    banner.className = 'banner fail show';
                    banner.innerHTML =
                        `❌ Есть ошибки. Правильно: ${correct} из ${total}. Карточки с ошибками выделены красным.`;
                }
            }

            // ---- сброс ----
            function resetAll() {
                placed = {};
                banner.className = 'banner';
                banner.style.display = 'none';
                render();
            }

            // ---- инициализация ----
            render();

            checkBtn.addEventListener('click', checkAnswers);
            resetBtn.addEventListener('click', resetAll);

        })();
    </script>

</body>
</html>
