<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ремонт на ОПО: расставь по местам</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            padding: 1.8rem 2rem 2rem;
            border: 1px solid #e8edf5;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 650;
            color: #0b1f3b;
            margin-bottom: 0.2rem;
        }

        .subhead {
            background: #edf4fe;
            padding: 0.5rem 1rem;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #1a3552;
            border-left: 4px solid #2a6f97;
            margin: 0.3rem 0 1.2rem 0;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* элементы для перетаскивания */
        .items-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            padding: 0.8rem;
            background: #fafcff;
            border-radius: 16px;
            border: 2px dashed #c9d8ea;
            min-height: 70px;
            align-items: center;
            justify-content: center;
        }

        .draggable-item {
            background: #ffffff;
            border: 2px solid #b8cee8;
            border-radius: 30px;
            padding: 0.3rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #0b1f33;
            cursor: grab;
            user-select: none;
            transition: 0.1s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            white-space: nowrap;
        }

        .draggable-item:hover {
            border-color: #2a6f97;
            background: #f2f8ff;
        }

        .draggable-item:active {
            cursor: grabbing;
        }

        .draggable-item.dragging {
            opacity: 0.4;
        }

        .draggable-item.placed {
            border-color: #1e8e3e;
            background: #eef9f2;
            cursor: default;
        }

        .draggable-item.placed-wrong {
            border-color: #c72a2a;
            background: #ffe6e6;
            cursor: default;
        }

        /* зоны для сброса */
        .zones {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.8rem;
        }

        .drop-zone {
            background: #fafcff;
            border-radius: 16px;
            border: 2px solid #e1ebf6;
            padding: 0.6rem 0.8rem 0.8rem;
            min-height: 100px;
            transition: 0.12s;
        }

        .drop-zone.drag-over {
            border-color: #2a6f97;
            background: #f0f6fe;
        }

        .drop-zone h3 {
            font-size: 0.75rem;
            font-weight: 600;
            color: #1f4870;
            margin-bottom: 0.3rem;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .drop-zone .zone-items {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            min-height: 30px;
            align-items: flex-start;
        }

        .drop-zone .zone-items .draggable-item {
            cursor: default;
        }

        .drop-zone.correct {
            border-color: #1e8e3e;
            background: #eef9f2;
        }

        .drop-zone.wrong {
            border-color: #c72a2a;
            background: #ffe6e6;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1rem;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: white;
            border: 1px solid #c7d9ed;
            padding: 0.35rem 1.4rem;
            border-radius: 30px;
            font-weight: 600;
            color: #1b4470;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.85rem;
            height: 38px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #1a5f8b;
            border: 1px solid #1a5f8b;
            color: white;
            box-shadow: 0 3px 10px rgba(21, 80, 120, 0.18);
        }
        .btn-primary:hover {
            background: #0e4a70;
        }
        .btn-outline:hover {
            background: #e9f0fa;
        }
        .btn-success {
            background: #1e8e3e;
            border: 1px solid #1e8e3e;
            color: white;
        }
        .btn-success:hover {
            background: #157a33;
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .btn:active {
            transform: scale(0.96);
        }

        .banner {
            margin-top: 0.8rem;
            padding: 0.7rem 1.2rem;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.9rem;
            display: none;
            border: 1px solid;
            line-height: 1.5;
        }
        .banner.success {
            background: #e1f5e8;
            border-color: #1f8b4c;
            color: #0a4628;
            display: block;
        }
        .banner.fail {
            background: #fde9e9;
            border-color: #b33c3c;
            color: #712b2b;
            display: block;
        }

        .results-detail {
            margin-top: 0.6rem;
            padding: 0.6rem 1rem 0.8rem;
            background: #f2f8fe;
            border-radius: 14px;
            border: 1px solid #d6e5f5;
            display: none;
        }
        .results-detail.show {
            display: block;
        }
        .results-detail h4 {
            font-size: 0.85rem;
            color: #0b2a44;
            margin-bottom: 0.3rem;
        }
        .results-detail ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .results-detail ul li {
            font-size: 0.8rem;
            padding: 0.15rem 0 0.15rem 1.4rem;
            position: relative;
            color: #1a3552;
            line-height: 1.4;
            border-bottom: 1px solid #e8edf5;
        }
        .results-detail ul li:last-child {
            border-bottom: none;
        }
        .results-detail ul li .icon {
            position: absolute;
            left: 0;
            top: 0.15rem;
        }

        @media (max-width: 700px) {
            .container {
                padding: 1rem;
            }
            .zones {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            .drop-zone {
                min-height: 70px;
            }
            .items-pool {
                padding: 0.5rem;
                min-height: 50px;
            }
            .draggable-item {
                font-size: 0.7rem;
                padding: 0.2rem 0.7rem;
                white-space: normal;
            }
            .btn-group {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <h1>🔧 Ремонт на ОПО: расставь по местам</h1>
        <div class="subhead">
            Распределите действия и документы между <strong>заказчиком</strong>, <strong>подрядчиком</strong> и <strong>общей зоной</strong>.
            Перетащите каждый элемент в нужную зону.
        </div>

        <div class="game-area">
            <!-- Пул элементов -->
            <div class="items-pool" id="pool"></div>

            <!-- Зоны -->
            <div class="zones" id="zones">
                <div class="drop-zone" data-zone="customer">
                    <h3>🏢 Заказчик</h3>
                    <div class="zone-items" id="zone-customer"></div>
                </div>
                <div class="drop-zone" data-zone="contractor">
                    <h3>🔧 Подрядчик</h3>
                    <div class="zone-items" id="zone-contractor"></div>
                </div>
                <div class="drop-zone" data-zone="shared">
                    <h3>🤝 Общая зона</h3>
                    <div class="zone-items" id="zone-shared"></div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="checkBtn">✅ Проверить</button>
                <button class="btn btn-outline" id="resetBtn">🔄 Сбросить</button>
            </div>

            <div id="banner" class="banner"></div>

            <div id="resultsDetail" class="results-detail">
                <h4>📌 Разбор ошибок</h4>
                <ul id="resultsList"></ul>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---- данные ----
            const itemsData = [
                { id: 'p1', text: 'Составить план подготовительных работ', zone: 'customer' },
                { id: 'p2', text: 'Организовать изготовление деталей для замены', zone: 'customer' },
                { id: 'p3', text: 'Закупить оборудование и материалы по дефектной ведомости', zone: 'customer' },
                { id: 'p4', text: 'Разработать проект и график работ', zone: 'contractor' },
                { id: 'p5', text: 'Согласовать проект с заказчиком', zone: 'shared' },
                { id: 'p6', text: 'Утвердить проект', zone: 'customer' },
                { id: 'p7', text: 'Познакомить исполнителей с проектом', zone: 'contractor' },
                { id: 'p8', text: 'Передать ведомость дефектов подрядчику', zone: 'customer' },
                { id: 'p9', text: 'Передать сметную документацию', zone: 'customer' },
                { id: 'p10', text: 'Передать технические условия на ремонт', zone: 'customer' },
                { id: 'p11', text: 'Подключить и отключить электроприемники подрядчика', zone: 'customer' },
                { id: 'p12', text: 'Использовать подъемные сооружения с разрешения заказчика', zone: 'contractor' },
                { id: 'p13', text: 'Назначить координатора при нескольких подрядчиках', zone: 'customer' },
                { id: 'p14', text: 'Осуществлять общую координацию работ', zone: 'customer' },
                { id: 'p15', text: 'Оформить остановку оборудования распоряжением', zone: 'customer' }
            ];

            // ---- DOM ----
            const pool = document.getElementById('pool');
            const zoneCustomer = document.getElementById('zone-customer');
            const zoneContractor = document.getElementById('zone-contractor');
            const zoneShared = document.getElementById('zone-shared');
            const zones = {
                customer: zoneCustomer,
                contractor: zoneContractor,
                shared: zoneShared
            };
            const dropZones = document.querySelectorAll('.drop-zone');
            const checkBtn = document.getElementById('checkBtn');
            const resetBtn = document.getElementById('resetBtn');
            const banner = document.getElementById('banner');
            const resultsDetail = document.getElementById('resultsDetail');
            const resultsList = document.getElementById('resultsList');

            let draggedItem = null;
            let draggedId = null;

            // ---- рендер пула ----
            function renderPool() {
                const placedIds = new Set();
                document.querySelectorAll('.zone-items .draggable-item').forEach(el => {
                    placedIds.add(el.dataset.id);
                });

                let html = '';
                itemsData.forEach(item => {
                    if (!placedIds.has(item.id)) {
                        html += `
                            <div class="draggable-item" draggable="true" data-id="${item.id}" data-zone="${item.zone}">
                                ${item.text}
                            </div>
                        `;
                    }
                });
                pool.innerHTML = html || '<span style="color:#8a9aaa; font-size:0.8rem;">Все элементы размещены</span>';

                pool.querySelectorAll('.draggable-item').forEach(el => {
                    el.addEventListener('dragstart', handleDragStart);
                    el.addEventListener('dragend', handleDragEnd);
                });
            }

            // ---- обработчики drag ----
            function handleDragStart(e) {
                draggedItem = this;
                draggedId = this.dataset.id;
                this.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', this.dataset.id);
            }

            function handleDragEnd(e) {
                this.classList.remove('dragging');
                dropZones.forEach(z => z.classList.remove('drag-over'));
            }

            // ---- обработчики drop-зон ----
            dropZones.forEach(zone => {
                zone.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    this.classList.add('drag-over');
                });

                zone.addEventListener('dragleave', function(e) {
                    this.classList.remove('drag-over');
                });

                zone.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.classList.remove('drag-over');

                    const id = e.dataTransfer.getData('text/plain');
                    const item = itemsData.find(i => i.id === id);
                    if (!item) return;

                    if (document.querySelector(`.zone-items .draggable-item[data-id="${id}"]`)) return;

                    const poolItem = pool.querySelector(`.draggable-item[data-id="${id}"]`);
                    if (!poolItem) return;

                    const zoneItems = this.querySelector('.zone-items');
                    const clone = poolItem.cloneNode(true);
                    clone.classList.remove('dragging');
                    clone.draggable = false;
                    clone.style.cursor = 'default';
                    zoneItems.appendChild(clone);

                    poolItem.remove();

                    if (pool.children.length === 0) {
                        pool.innerHTML = '<span style="color:#8a9aaa; font-size:0.8rem;">Все элементы размещены</span>';
                    }

                    clearResults();
                });
            });

            // ---- сброс ----
            function resetGame() {
                zoneCustomer.innerHTML = '';
                zoneContractor.innerHTML = '';
                zoneShared.innerHTML = '';
                dropZones.forEach(z => z.classList.remove('correct', 'wrong'));

                renderPool();
                clearResults();
                banner.className = 'banner';
                banner.style.display = 'none';
            }

            // ---- очистка результатов ----
            function clearResults() {
                resultsDetail.classList.remove('show');
                resultsList.innerHTML = '';
                document.querySelectorAll('.draggable-item.placed, .draggable-item.placed-wrong').forEach(el => {
                    el.classList.remove('placed', 'placed-wrong');
                });
                dropZones.forEach(z => z.classList.remove('correct', 'wrong'));
            }

            // ---- проверка ----
            function checkAnswers() {
                let allCorrect = true;
                let errors = [];

                const placed = [];
                document.querySelectorAll('.zone-items .draggable-item').forEach(el => {
                    const id = el.dataset.id;
                    const zone = el.closest('.drop-zone').dataset.zone;
                    const item = itemsData.find(i => i.id === id);
                    placed.push({ id, zone, correct: item.zone, text: item.text });
                });

                if (placed.length < itemsData.length) {
                    banner.className = 'banner fail';
                    banner.style.display = 'block';
                    banner.innerHTML = '⚠️ Разместите все элементы перед проверкой.';
                    resultsDetail.classList.remove('show');
                    return;
                }

                placed.forEach(p => {
                    const isCorrect = (p.zone === p.correct);
                    if (!isCorrect) {
                        allCorrect = false;
                        errors.push({
                            text: p.text,
                            userZone: p.zone,
                            correctZone: p.correct
                        });
                    }
                });

                document.querySelectorAll('.drop-zone').forEach(z => {
                    z.classList.remove('correct', 'wrong');
                });

                document.querySelectorAll('.zone-items .draggable-item').forEach(el => {
                    el.classList.remove('placed', 'placed-wrong');
                    const id = el.dataset.id;
                    const item = itemsData.find(i => i.id === id);
                    const zone = el.closest('.drop-zone').dataset.zone;
                    if (zone === item.zone) {
                        el.classList.add('placed');
                    } else {
                        el.classList.add('placed-wrong');
                        el.closest('.drop-zone').classList.add('wrong');
                    }
                });

                document.querySelectorAll('.drop-zone').forEach(z => {
                    const zoneName = z.dataset.zone;
                    const itemsInZone = z.querySelectorAll('.draggable-item');
                    let allInZoneCorrect = true;
                    itemsInZone.forEach(el => {
                        const id = el.dataset.id;
                        const item = itemsData.find(i => i.id === id);
                        if (zoneName !== item.zone) allInZoneCorrect = false;
                    });
                    if (itemsInZone.length > 0 && allInZoneCorrect) {
                        z.classList.add('correct');
                    }
                });

                banner.style.display = 'block';
                if (allCorrect) {
                    banner.className = 'banner success';
                    banner.innerHTML = '✅ Отлично! Вы правильно распределили все элементы. Так держать!';
                    resultsDetail.classList.remove('show');
                } else {
                    banner.className = 'banner fail';
                    banner.innerHTML = `❌ Есть ошибки. Проверьте выделенные красным элементы.`;

                    let listHtml = '';
                    errors.forEach(e => {
                        const zoneMap = {
                            customer: 'Заказчик',
                            contractor: 'Подрядчик',
                            shared: 'Общая зона'
                        };
                        listHtml += `
                            <li>
                                <span class="icon">❌</span>
                                <strong>${e.text}</strong>
                                <br>
                                <span style="font-size:0.75rem; color:#4a6a8a;">
                                    Вы отнесли к <strong>${zoneMap[e.userZone]}</strong>, 
                                    правильно — <strong>${zoneMap[e.correctZone]}</strong>
                                </span>
                            </li>
                        `;
                    });
                    resultsList.innerHTML = listHtml;
                    resultsDetail.classList.add('show');
                }
            }

            // ---- инициализация ----
            renderPool();

            checkBtn.addEventListener('click', checkAnswers);
            resetBtn.addEventListener('click', resetGame);
        })();
    </script>

</body>
</html>
